<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#1769aa">
<title>Weight Bill App</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f2f4f7;
    color:#222;
}

.app{
    max-width:1100px;
    margin:auto;
    padding:10px;
}

.top{
    background:#1769aa;
    color:#fff;
    padding:14px;
    border-radius:12px 12px 0 0;
}

.top h1{
    margin:0 0 5px;
    font-size:24px;
}

.top p{
    margin:0;
    font-size:14px;
}

.card{
    background:#fff;
    border-radius:0 0 12px 12px;
    box-shadow:0 2px 10px #0001;
    padding:12px;
}

.date-row{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:12px;
}

.date-row label{
    font-weight:bold;
}

.date-row input{
    max-width:190px;
}

.actions{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    margin-bottom:12px;
}

button{
    border:0;
    border-radius:8px;
    padding:11px 13px;
    font-size:15px;
    font-weight:bold;
    cursor:pointer;
}

.add{background:#198754;color:#fff}
.remove{background:#dc3545;color:#fff}
.new{background:#6c757d;color:#fff}
.print{background:#0d6efd;color:#fff}
.jpg{background:#e67e22;color:#fff}
.share{background:#25d366;color:#fff}
.copy{background:#673ab7;color:#fff}

/* BILL - SIMPLE DESIGN */
.bill-print-area{
    background:#fff;
    padding:25px;
    color:#111;
}

.bill-date{
    font-size:20px;
    font-weight:bold;
    margin-bottom:18px;
}

/* Two sides always together */
.sides{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:0;
}

.side{
    min-width:0;
}

table{
    width:100%;
    border-collapse:collapse;
    table-layout:fixed;
}

th,td{
    border:1px solid #bdbdbd;
    padding:9px 10px;
    text-align:left;
    font-size:16px;
    height:38px;
}

th{
    font-weight:bold;
}

th:first-child,
td:first-child{
    width:18%;
}

th:nth-child(2),
td:nth-child(2){
    width:40%;
}

th:nth-child(3),
td:nth-child(3){
    width:42%;
}

input{
    width:100%;
    border:0;
    outline:0;
    background:transparent;
    font-size:16px;
    padding:2px;
    text-align:left;
}

.total-row td{
    font-weight:bold;
    height:42px;
}

/* Combined total */
.combined{
    margin-top:25px;
}

.combined-line{
    font-size:21px;
    font-weight:bold;
    margin:12px 0;
    white-space:nowrap;
}

.hint{
    font-size:12px;
    color:#666;
    margin-top:10px;
    line-height:1.5;
}

/* Mobile */
@media(max-width:700px){

    .app{
        padding:6px;
    }

    .top h1{
        font-size:21px;
    }

    .sides{
        grid-template-columns:1fr 1fr;
        gap:0;
    }

    .bill-print-area{
        padding:10px 4px;
    }

    .bill-date{
        font-size:15px;
        margin-bottom:10px;
    }

    th,td{
        padding:7px 5px;
        font-size:12px;
        height:35px;
    }

    input{
        font-size:13px;
    }

    .combined-line{
        font-size:17px;
    }

    button{
        flex:1;
        min-width:135px;
    }
}

/* PRINT */
@media print{

    body{
        background:#fff;
    }

    .app{
        max-width:none;
        padding:0;
    }

    .top,
    .date-row,
    .actions,
    .hint{
        display:none;
    }

    .card{
        box-shadow:none;
        padding:0;
    }

    .bill-print-area{
        padding:0;
    }

    .bill-date{
        font-size:18px;
        margin-bottom:12px;
    }

    th,td{
        font-size:12px;
        padding:7px;
        height:34px;
    }

    input{
        font-size:12px;
    }

    .combined-line{
        font-size:17px;
        margin:9px 0;
    }
}
</style>
</head>

<body>

<div class="app">

<div class="top">
    <h1>Weight Bill App</h1>
    <p>Qty, Weight અને Average automatic calculate</p>
</div>

<div class="card">

<div class="date-row">
    <label for="billDate">Date:</label>
    <input id="billDate" type="date">
</div>

<div class="actions">

<button class="add" onclick="addBox()">+ Add Box</button>

<button class="remove" onclick="removeBox()">− Remove Box</button>

<button class="new" onclick="newBill()">New Bill</button>

<button class="print" onclick="printBill()">🖨️ Print / PDF</button>

<button class="jpg" onclick="savePhoto()">🖼️ Save Photo Full HD</button>

<button class="share" onclick="shareBill()">📲 Share</button>

<button class="copy" onclick="copyBill()">📋 Copy Text</button>

</div>


<!-- BILL -->

<div class="bill-print-area" id="billArea">

<div class="bill-date">
Date:- <span id="showDate"></span>
</div>

<div class="sides">

<!-- LEFT 1-15 -->

<div class="side">

<table>

<thead>
<tr>
<th>No.</th>
<th>Qty.</th>
<th>Weight.</th>
</tr>
</thead>

<tbody id="leftRows"></tbody>

<tfoot>
<tr class="total-row">
<td>Total.</td>
<td id="leftQty">0</td>
<td id="leftWeight">0.0</td>
</tr>
</tfoot>

</table>

</div>


<!-- RIGHT 16-30 -->

<div class="side">

<table>

<thead>
<tr>
<th>No.</th>
<th>Qty.</th>
<th>Weight.</th>
</tr>
</thead>

<tbody id="rightRows"></tbody>

<tfoot>
<tr class="total-row">
<td>Total.</td>
<td id="rightQty">0</td>
<td id="rightWeight">0.0</td>
</tr>
</tfoot>

</table>

</div>

</div>


<!-- TOTAL -->

<div class="combined">

<div class="combined-line">
Total AVG :- <span id="totalAvg">0.000</span>
</div>

<div class="combined-line">
Total Qty :- <span id="totalQty">0</span>
</div>

<div class="combined-line">
Total Weight :- <span id="totalWeight">0.0</span>
</div>

</div>

</div>

<div class="hint">
Save Photo કરવાથી ફક્ત bill નું photo save થશે.
</div>

</div>
</div>


<script>

let boxCount = 30;


/* DATE */

const today = new Date();

document.getElementById("billDate").value =
today.toISOString().slice(0,10);


/* CREATE ROW */

function createRow(i, values={}){

    const tr = document.createElement("tr");

    tr.innerHTML = `
        <td>${i}.</td>

        <td>
            <input
                type="number"
                min="0"
                step="1"
                inputmode="numeric"
                class="qty"
                value="${values.qty || ""}"
                oninput="calculate()"
            >
        </td>

        <td>
            <input
                type="number"
                min="0"
                step="0.1"
                inputmode="decimal"
                class="weight"
                value="${values.weight || ""}"
                oninput="calculate()"
            >
        </td>
    `;

    return tr;
}


/* SAVE CURRENT VALUES */

function getValues(){

    const values = {};

    document.querySelectorAll("#billArea tbody tr").forEach(tr=>{

        const no = parseInt(
            tr.children[0].textContent
        );

        values[no] = {
            qty: tr.querySelector(".qty").value,
            weight: tr.querySelector(".weight").value
        };

    });

    return values;
}


/* RENDER */

function renderRows(values={}){

    const left = document.getElementById("leftRows");
    const right = document.getElementById("rightRows");

    left.innerHTML = "";
    right.innerHTML = "";

    const leftCount = Math.ceil(boxCount / 2);

    for(let i=1;i<=boxCount;i++){

        const row = createRow(i, values[i] || {});

        if(i <= leftCount){
            left.appendChild(row);
        }else{
            right.appendChild(row);
        }

    }

    calculate();
}


/* CALCULATE */

function calculate(){

    let totalQty = 0;
    let totalWeight = 0;

    let leftQty = 0;
    let leftWeight = 0;

    let rightQty = 0;
    let rightWeight = 0;


    document.querySelectorAll("#billArea tbody tr")
    .forEach(tr=>{

        const qty =
        parseFloat(tr.querySelector(".qty").value) || 0;

        const weight =
        parseFloat(tr.querySelector(".weight").value) || 0;

        const no =
        parseInt(tr.children[0].textContent);


        totalQty += qty;
        totalWeight += weight;


        if(no <= Math.ceil(boxCount / 2)){

            leftQty += qty;
            leftWeight += weight;

        }else{

            rightQty += qty;
            rightWeight += weight;

        }

    });


    document.getElementById("leftQty").textContent =
    leftQty;

    document.getElementById("leftWeight").textContent =
    leftWeight.toFixed(1);


    document.getElementById("rightQty").textContent =
    rightQty;

    document.getElementById("rightWeight").textContent =
    rightWeight.toFixed(1);


    document.getElementById("totalQty").textContent =
    totalQty;

    document.getElementById("totalWeight").textContent =
    totalWeight.toFixed(1);


    const avg =
    totalQty > 0
    ? totalWeight / totalQty
    : 0;


    document.getElementById("totalAvg").textContent =
    avg.toFixed(3);


    showDate();
}


/* SHOW DATE */

function showDate(){

    const value =
    document.getElementById("billDate").value;

    if(!value){
        document.getElementById("showDate").textContent="";
        return;
    }

    const [y,m,d] = value.split("-");

    document.getElementById("showDate").textContent =
    `${d} / ${m} / ${y}`;
}


document
.getElementById("billDate")
.addEventListener("change",calculate);


/* ADD BOX - 2 BOX */

function addBox(){

    const values = getValues();

    boxCount += 2;

    renderRows(values);
}


/* REMOVE BOX - 2 BOX */

function removeBox(){

    if(boxCount <= 2){
        alert("Minimum 2 Box રાખવા જરૂરી છે.");
        return;
    }

    const values = getValues();

    boxCount -= 2;

    renderRows(values);
}


/* NEW BILL */

function newBill(){

    if(
        !confirm(
            "New Bill બનાવવાથી બધા Qty અને Weight ખાલી થઈ જશે. Continue?"
        )
    ){
        return;
    }

    boxCount = 30;

    document.getElementById("billDate").value =
    new Date().toISOString().slice(0,10);

    renderRows();

    window.scrollTo({
        top:0,
        behavior:"smooth"
    });
}


/* PRINT */

function printBill(){

    calculate();

    window.print();
}


/* BILL TEXT */

function billText(){

    calculate();

    let lines = [];

    lines.push("WEIGHT BILL");

    lines.push(
        "Date:- " +
        document.getElementById("showDate").textContent
    );

    lines.push("-------------------------");


    document
    .querySelectorAll("#billArea tbody tr")
    .forEach(tr=>{

        const q =
        tr.querySelector(".qty").value || "";

        const w =
        tr.querySelector(".weight").value || "";

        if(q !== "" || w !== ""){

            lines.push(
                `No. ${tr.children[0].textContent} Qty: ${q} Weight: ${w}`
            );

        }

    });


    lines.push("-------------------------");

    lines.push(
        `Total AVG :- ${document.getElementById("totalAvg").textContent}`
    );

    lines.push(
        `Total Qty :- ${document.getElementById("totalQty").textContent}`
    );

    lines.push(
        `Total Weight :- ${document.getElementById("totalWeight").textContent}`
    );


    return lines.join("\n");
}


/* COPY */

async function copyBill(){

    const text = billText();

    try{

        await navigator.clipboard.writeText(text);

        alert("Bill text copy થઈ ગયું ✅");

    }catch(e){

        prompt("આ text copy કરો:",text);

    }

}


/* HTML2CANVAS */

function loadHtml2Canvas(){

    return new Promise((resolve,reject)=>{

        if(window.html2canvas){
            resolve();
            return;
        }

        const script =
        document.createElement("script");

        script.src =
        "https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js";

        script.onload = resolve;

        script.onerror = reject;

        document.head.appendChild(script);

    });

}


/* FULL HD IMAGE */

async function makePhoto(){

    calculate();

    await loadHtml2Canvas();

    const area =
    document.getElementById("billArea");


    return await html2canvas(area,{

        scale:4,

        useCORS:true,

        backgroundColor:"#ffffff",

        logging:false,

        imageTimeout:0

    });

}


/* SAVE PHOTO */

async function savePhoto(){

    try{

        const canvas =
        await makePhoto();


        const link =
        document.createElement("a");


        link.download =
        "Weight_Bill_Full_HD_" +
        new Date().toISOString().slice(0,10) +
        ".png";


        link.href =
        canvas.toDataURL("image/png");


        link.click();


    }catch(e){

        alert(
            "Photo save કરવા Internet ON કરીને ફરી try કરો."
        );

    }

}


/* SHARE */

async function shareBill(){

    try{

        const canvas =
        await makePhoto();


        const blob =
        await new Promise(resolve =>
            canvas.toBlob(
                resolve,
                "image/png"
            )
        );


        const file =
        new File(
            [blob],
            "Weight_Bill.png",
            {type:"image/png"}
        );


        if(
            navigator.share &&
            (!navigator.canShare ||
             navigator.canShare({files:[file]}))
        ){

            await navigator.share({

                title:"Weight Bill",

                text:billText(),

                files:[file]

            });

        }else{

            if(navigator.share){

                await navigator.share({

                    title:"Weight Bill",

                    text:billText()

                });

            }else{

                window.open(
                    "https://wa.me/?text="+
                    encodeURIComponent(billText()),
                    "_blank"
                );

            }

        }

    }catch(e){

        if(e.name !== "AbortError"){

            window.open(
                "https://wa.me/?text="+
                encodeURIComponent(billText()),
                "_blank"
            );

        }

    }

}


/* START */

renderRows();

</script>

</body>
</html>
