<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#ffffff">
<title>Weight Bill App</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f2f2f2;
    color:#222;
}

.app{
    max-width:1100px;
    margin:auto;
    padding:10px;
}

/* TOP */
.top{
    background:#fff;
    padding:12px;
    border:1px solid #ddd;
}

.top h1{
    margin:0 0 5px;
    font-size:23px;
}

.top p{
    margin:0;
    font-size:13px;
    color:#555;
}

/* CARD */
.card{
    background:#fff;
    padding:12px;
    border:1px solid #ddd;
}

/* DATE */
.date-row{
    display:flex;
    align-items:center;
    gap:8px;
    margin-bottom:10px;
}

.date-row label{
    font-weight:bold;
}

.date-row input{
    width:auto;
}

/* BUTTONS */
.actions{
    display:flex;
    gap:7px;
    flex-wrap:wrap;
    margin-bottom:12px;
}

button{
    border:1px solid #aaa;
    background:#fff;
    padding:9px 12px;
    font-size:14px;
    font-weight:bold;
    cursor:pointer;
}

button:active{
    transform:scale(.98);
}

.add{
    border-color:#198754;
}

.remove{
    border-color:#dc3545;
}

.settings-btn{
    border-color:#555;
}

/* SETTINGS */
.settings{
    display:none;
    border:1px solid #aaa;
    padding:12px;
    margin-bottom:12px;
    background:#fafafa;
}

.settings h3{
    margin:0 0 12px;
    font-size:18px;
}

.setting-row{
    display:flex;
    align-items:center;
    gap:8px;
    flex-wrap:wrap;
    margin-bottom:10px;
}

.setting-row label{
    min-width:180px;
    font-weight:bold;
}

.setting-row button{
    min-width:40px;
    padding:6px 10px;
}

.setting-value{
    min-width:55px;
    text-align:center;
    font-weight:bold;
}

.color-range{
    width:180px;
}

.auto-box{
    display:flex;
    align-items:center;
    gap:7px;
}

.auto-box input{
    width:auto;
}

/* BILL */
.bill-print-area{
    background:#fff;
    padding:20px;
    color:rgb(var(--textColor),var(--textColor),var(--textColor));
}

.bill-date{
    font-size:var(--textSize);
    font-weight:bold;
    margin-bottom:15px;
}

/* TWO TABLES */
.sides{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:0;
}

.side{
    min-width:0;
}

table{
    width:100%;
    border-collapse:collapse;
    table-layout:fixed;
}

th,td{
    border:1px solid #999;
    padding:var(--boxPadding);
    text-align:left;
    font-size:var(--textSize);
    height:var(--boxHeight);
}

th{
    font-weight:bold;
}

/* NO COLUMN */
th:first-child,
td:first-child{
    width:20%;
}

/* QTY */
th:nth-child(2),
td:nth-child(2){
    width:38%;
}

/* WEIGHT */
th:nth-child(3),
td:nth-child(3){
    width:42%;
}

input{
    width:100%;
    border:0;
    outline:0;
    background:transparent;
    font-size:var(--textSize);
    color:rgb(var(--textColor),var(--textColor),var(--textColor));
    padding:2px;
    text-align:left;
}

.total-row td{
    font-weight:bold;
}

/* EDITABLE TOTAL INPUT */
.total-input{
    width:100%;
    font-weight:bold;
    border:0;
    outline:0;
    background:transparent;
    font-size:var(--textSize);
}

/* COMBINED TOTAL */
.combined{
    margin-top:20px;
}

.combined-line{
    font-size:calc(var(--textSize) + 5px);
    font-weight:bold;
    margin:10px 0;
    white-space:nowrap;
}

.combined-input{
    border:0;
    outline:0;
    background:transparent;
    font-size:inherit;
    font-weight:bold;
    width:150px;
    color:inherit;
}

/* HINT */
.hint{
    font-size:12px;
    color:#666;
    margin-top:10px;
}

/* MOBILE */
@media(max-width:700px){

    .app{
        padding:5px;
    }

    .top h1{
        font-size:20px;
    }

    .bill-print-area{
        padding:8px 3px;
    }

    .bill-date{
        font-size:14px;
        margin-bottom:9px;
    }

    th,td{
        padding:var(--boxPaddingMobile);
        font-size:var(--mobileTextSize);
        height:var(--boxHeightMobile);
    }

    input{
        font-size:var(--mobileTextSize);
    }

    .combined-line{
        font-size:calc(var(--mobileTextSize) + 4px);
    }

    .combined-input{
        font-size:inherit;
    }

    button{
        padding:9px 10px;
    }

    .setting-row label{
        min-width:145px;
    }
}

/* PRINT */
@media print{

    body{
        background:#fff;
    }

    .app{
        max-width:none;
        padding:0;
    }

    .top,
    .date-row,
    .actions,
    .settings,
    .hint{
        display:none !important;
    }

    .card{
        border:0;
        padding:0;
    }

    .bill-print-area{
        padding:0;
    }

    th,td{
        font-size:12px;
        padding:7px;
        height:32px;
    }

    input{
        font-size:12px;
    }

    .combined-line{
        font-size:17px;
    }

    .combined-input{
        font-size:17px;
    }
}
</style>
</head>

<body>

<div class="app">

<div class="top">
    <h1>Weight Bill App</h1>
    <p>Qty, Weight અને Average automatic calculate</p>
</div>

<div class="card">

<!-- DATE -->
<div class="date-row">
    <label>Date:</label>
    <input id="billDate" type="date">
</div>

<!-- BUTTONS -->
<div class="actions">

<button class="add" onclick="addBox()">+ Add Box</button>

<button class="remove" onclick="removeBox()">− Remove Box</button>

<button onclick="newBill()">New Bill</button>

<button onclick="printBill()">🖨️ Print / PDF</button>

<button onclick="savePhoto()">🖼️ Save Photo Full HD</button>

<button onclick="copyBill()">📋 Copy Text</button>

<button class="settings-btn" onclick="toggleSettings()">
⚙️ Edit / Settings
</button>

</div>


<!-- SETTINGS -->
<div class="settings" id="settings">

<h3>⚙️ Bill Edit / Settings</h3>

<!-- AUTO TOTAL -->
<div class="setting-row">
    <label>Auto Total:</label>

    <div class="auto-box">
        <input
            type="checkbox"
            id="autoTotal"
            checked
            onchange="calculate()"
        >
        <span>Automatic Calculate</span>
    </div>
</div>


<!-- BOX SIZE -->
<div class="setting-row">

<label>Box Size:</label>

<button onclick="changeBoxSize(-2)">−</button>

<span class="setting-value" id="boxSizeValue">
38
</span>

<button onclick="changeBoxSize(2)">+</button>

</div>


<!-- TEXT SIZE -->
<div class="setting-row">

<label>Number / Text Size:</label>

<button onclick="changeTextSize(-1)">A−</button>

<span class="setting-value" id="textSizeValue">
16
</span>

<button onclick="changeTextSize(1)">A+</button>

</div>


<!-- TEXT COLOUR -->
<div class="setting-row">

<label>Number / Text Colour:</label>

<input
    class="color-range"
    id="colorRange"
    type="range"
    min="40"
    max="255"
    value="20"
    oninput="changeTextColor(this.value)"
>

<span class="setting-value" id="colorValue">
20
</span>

</div>


<!-- RESET STYLE -->
<div class="setting-row">

<label>Style Reset:</label>

<button onclick="resetStyle()">
Reset
</button>

</div>

</div>


<!-- BILL -->
<div class="bill-print-area" id="billArea">

<div class="bill-date">
Date:- <span id="showDate"></span>
</div>


<div class="sides">

<!-- LEFT -->
<div class="side">

<table>

<thead>
<tr>
<th>No.</th>
<th>Qty.</th>
<th>Weight.</th>
</tr>
</thead>

<tbody id="leftRows"></tbody>

<tfoot>

<tr class="total-row">

<td>Total.</td>

<td>
<input
    class="total-input"
    id="leftQty"
    value="0"
    type="number"
    step="1"
>
</td>

<td>
<input
    class="total-input"
    id="leftWeight"
    value="0.0"
    type="number"
    step="0.1"
>
</td>

</tr>

</tfoot>

</table>

</div>


<!-- RIGHT -->
<div class="side">

<table>

<thead>
<tr>
<th>No.</th>
<th>Qty.</th>
<th>Weight.</th>
</tr>
</thead>

<tbody id="rightRows"></tbody>

<tfoot>

<tr class="total-row">

<td>Total.</td>

<td>
<input
    class="total-input"
    id="rightQty"
    value="0"
    type="number"
    step="1"
>
</td>

<td>
<input
    class="total-input"
    id="rightWeight"
    value="0.0"
    type="number"
    step="0.1"
>
</td>

</tr>

</tfoot>

</table>

</div>

</div>


<!-- COMBINED TOTAL -->
<div class="combined">

<div class="combined-line">
Total AVG :-
<input
    class="combined-input"
    id="totalAvg"
    value="0.000"
>
</div>


<div class="combined-line">
Total Qty :-
<input
    class="combined-input"
    id="totalQty"
    value="0"
>
</div>


<div class="combined-line">
Total Weight :-
<input
    class="combined-input"
    id="totalWeight"
    value="0.0"
>
</div>

</div>

</div>


<div class="hint">
⚙️ Edit / Settings માંથી Box size, text size અને text colour બદલી શકો છો.
</div>

</div>
</div>


<script>

/* =========================
   SETTINGS
========================= */

let boxCount = 30;

let boxHeight = 38;

let textSize = 16;

let textColor = 20;


/* APPLY STYLE */

function applyStyle(){

    const root =
    document.documentElement;

    root.style.setProperty(
        "--boxHeight",
        boxHeight + "px"
    );

    root.style.setProperty(
        "--boxHeightMobile",
        Math.max(30,boxHeight - 3) + "px"
    );

    root.style.setProperty(
        "--boxPadding",
        Math.max(5,boxHeight / 5) + "px"
    );

    root.style.setProperty(
        "--boxPaddingMobile",
        Math.max(4,boxHeight / 7) + "px"
    );

    root.style.setProperty(
        "--textSize",
        textSize + "px"
    );

    root.style.setProperty(
        "--mobileTextSize",
        Math.max(11,textSize - 3) + "px"
    );

    root.style.setProperty(
        "--textColor",
        textColor
    );


    document.getElementById(
        "boxSizeValue"
    ).textContent = boxHeight;


    document.getElementById(
        "textSizeValue"
    ).textContent = textSize;


    document.getElementById(
        "colorValue"
    ).textContent = textColor;
}


/* BOX SIZE */

function changeBoxSize(amount){

    boxHeight += amount;

    if(boxHeight < 28){
        boxHeight = 28;
    }

    if(boxHeight > 70){
        boxHeight = 70;
    }

    applyStyle();
}


/* TEXT SIZE */

function changeTextSize(amount){

    textSize += amount;

    if(textSize < 11){
        textSize = 11;
    }

    if(textSize > 28){
        textSize = 28;
    }

    applyStyle();
}


/* TEXT COLOR */

function changeTextColor(value){

    textColor = parseInt(value);

    applyStyle();
}


/* RESET */

function resetStyle(){

    boxHeight = 38;

    textSize = 16;

    textColor = 20;

    document.getElementById(
        "colorRange"
    ).value = 20;

    applyStyle();
}


/* SETTINGS OPEN */

function toggleSettings(){

    const box =
    document.getElementById("settings");

    if(box.style.display === "block"){

        box.style.display = "none";

    }else{

        box.style.display = "block";

    }

}


/* =========================
   DATE
========================= */

const today = new Date();

document.getElementById("billDate").value =
today.toISOString().slice(0,10);


function showDate(){

    const value =
    document.getElementById("billDate").value;

    if(!value){

        document.getElementById(
            "showDate"
        ).textContent = "";

        return;
    }

    const [y,m,d] =
    value.split("-");

    document.getElementById(
        "showDate"
    ).textContent =
    `${d} / ${m} / ${y}`;
}


document
.getElementById("billDate")
.addEventListener(
    "change",
    calculate
);


/* =========================
   CREATE ROW
========================= */

function createRow(i,values={}){

    const tr =
    document.createElement("tr");

    tr.innerHTML = `

        <td>${i}.</td>

        <td>

            <input
                type="number"
                min="0"
                step="1"
                inputmode="numeric"
                class="qty"
                value="${values.qty || ""}"
                oninput="calculate()"
            >

        </td>

        <td>

            <input
                type="number"
                min="0"
                step="0.1"
                inputmode="decimal"
                class="weight"
                value="${values.weight || ""}"
                oninput="calculate()"
            >

        </td>

    `;

    return tr;
}


/* =========================
   SAVE VALUES
========================= */

function getValues(){

    const values = {};

    document
    .querySelectorAll(
        "#billArea tbody tr"
    )
    .forEach(tr=>{

        const no =
        parseInt(
            tr.children[0]
            .textContent
        );

        values[no] = {

            qty:
            tr.querySelector(
                ".qty"
            ).value,

            weight:
            tr.querySelector(
                ".weight"
            ).value

        };

    });

    return values;
}


/* =========================
   RENDER ROWS
========================= */

function renderRows(values={}){

    const left =
    document.getElementById(
        "leftRows"
    );

    const right =
    document.getElementById(
        "rightRows"
    );

    left.innerHTML = "";

    right.innerHTML = "";


    const leftCount =
    Math.ceil(boxCount / 2);


    for(
        let i=1;
        i<=boxCount;
        i++
    ){

        const row =
        createRow(
            i,
            values[i] || {}
        );


        if(i <= leftCount){

            left.appendChild(row);

        }else{

            right.appendChild(row);

        }

    }


    calculate();
}


/* =========================
   CALCULATE
========================= */

function calculate(){

    showDate();


    const auto =
    document.getElementById(
        "autoTotal"
    ).checked;


    if(!auto){

        return;
    }


    let totalQty = 0;

    let totalWeight = 0;

    let leftQty = 0;

    let leftWeight = 0;

    let rightQty = 0;

    let rightWeight = 0;


    document
    .querySelectorAll(
        "#billArea tbody tr"
    )
    .forEach(tr=>{

        const qty =
        parseFloat(
            tr.querySelector(
                ".qty"
            ).value
        ) || 0;


        const weight =
        parseFloat(
            tr.querySelector(
                ".weight"
            ).value
        ) || 0;


        const no =
        parseInt(
            tr.children[0]
            .textContent
        );


        totalQty += qty;

        totalWeight += weight;


        if(
            no <=
            Math.ceil(
                boxCount / 2
            )
        ){

            leftQty += qty;

            leftWeight += weight;

        }else{

            rightQty += qty;

            rightWeight += weight;

        }

    });


    document.getElementById(
        "leftQty"
    ).value =
    leftQty;


    document.getElementById(
        "leftWeight"
    ).value =
    leftWeight.toFixed(1);


    document.getElementById(
        "rightQty"
    ).value =
    rightQty;


    document.getElementById(
        "rightWeight"
    ).value =
    rightWeight.toFixed(1);


    document.getElementById(
        "totalQty"
    ).value =
    totalQty;


    document.getElementById(
        "totalWeight"
    ).value =
    totalWeight.toFixed(1);


    const avg =
    totalQty > 0
    ? totalWeight / totalQty
    : 0;


    document.getElementById(
        "totalAvg"
    ).value =
    avg.toFixed(3);
}


/* =========================
   ADD 2 BOX
========================= */

function addBox(){

    const values =
    getValues();

    boxCount += 2;

    renderRows(values);
}


/* =========================
   REMOVE 2 BOX
========================= */

function removeBox(){

    if(boxCount <= 2){

        alert(
            "Minimum 2 Box રાખવા જરૂરી છે."
        );

        return;
    }


    const values =
    getValues();

    boxCount -= 2;

    renderRows(values);
}


/* =========================
   NEW BILL
========================= */

function newBill(){

    if(
        !confirm(
            "New Bill બનાવવાથી બધા Qty અને Weight ખાલી થઈ જશે. Continue?"
        )
    ){

        return;
    }


    boxCount = 30;


    document.getElementById(
        "billDate"
    ).value =
    new Date()
    .toISOString()
    .slice(0,10);


    document.getElementById(
        "autoTotal"
    ).checked = true;


    renderRows();


    window.scrollTo({

        top:0,

        behavior:"smooth"

    });
}


/* =========================
   PRINT
========================= */

function printBill(){

    calculate();

    window.print();
}


/* =========================
   BILL TEXT
========================= */

function billText(){

    calculate();


    let lines = [];


    lines.push(
        "WEIGHT BILL"
    );


    lines.push(
        "Date:- " +
        document.getElementById(
            "showDate"
        ).textContent
    );


    lines.push(
        "-------------------------"
    );


    document
    .querySelectorAll(
        "#billArea tbody tr"
    )
    .forEach(tr=>{

        const q =
        tr.querySelector(
            ".qty"
        ).value || "";


        const w =
        tr.querySelector(
            ".weight"
        ).value || "";


        if(
            q !== "" ||
            w !== ""
        ){

            lines.push(
                `No. ${tr.children[0].textContent} Qty: ${q} Weight: ${w}`
            );

        }

    });


    lines.push(
        "-------------------------"
    );


    lines.push(
        `Left Total :- Qty ${document.getElementById("leftQty").value} / Weight ${document.getElementById("leftWeight").value}`
    );


    lines.push(
        `Right Total :- Qty ${document.getElementById("rightQty").value} / Weight ${document.getElementById("rightWeight").value}`
    );


    lines.push(
        `Total AVG :- ${document.getElementById("totalAvg").value}`
    );


    lines.push(
        `Total Qty :- ${document.getElementById("totalQty").value}`
    );


    lines.push(
        `Total Weight :- ${document.getElementById("totalWeight").value}`
    );


    return lines.join("\n");
}


/* =========================
   COPY
========================= */

async function copyBill(){

    const text =
    billText();


    try{

        await navigator
        .clipboard
        .writeText(text);


        alert(
            "Bill text copy થઈ ગયું ✅"
        );

    }catch(e){

        prompt(
            "આ text copy કરો:",
            text
        );

    }
}


/* =========================
   HTML2CANVAS
========================= */

function loadHtml2Canvas(){

    return new Promise(
        (resolve,reject)=>{

            if(
                window.html2canvas
            ){

                resolve();

                return;
            }


            const script =
            document.createElement(
                "script"
            );


            script.src =
            "https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js";


            script.onload =
            resolve;


            script.onerror =
            reject;


            document.head.appendChild(
                script
            );

        }
    );
}


/* =========================
   PHOTO
========================= */

async function makePhoto(){

    calculate();

    await loadHtml2Canvas();


    const area =
    document.getElementById(
        "billArea"
    );


    return await html2canvas(
        area,
        {

            scale:4,

            useCORS:true,

            backgroundColor:
            "#ffffff",

            logging:false,

            imageTimeout:0

        }
    );
}


/* =========================
   SAVE PHOTO
========================= */

async function savePhoto(){

    try{

        const canvas =
        await makePhoto();


        const link =
        document.createElement(
            "a"
        );


        link.download =
        "Weight_Bill_Full_HD_" +
        new Date()
        .toISOString()
        .slice(0,10) +
        ".png";


        link.href =
        canvas.toDataURL(
            "image/png"
        );


        link.click();


    }catch(e){

        alert(
            "Photo save કર
