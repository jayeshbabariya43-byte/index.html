<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Weight Bill</title>

<style>
body{
font-family:Arial;
margin:0;
background:#f3f3f3;
color:#000
}

.app{
max-width:1000px;
margin:auto;
padding:12px
}

button{
padding:10px 14px;
margin:3px;
border:0;
border-radius:7px;
background:#222;
color:white;
font-size:16px
}

.bill{
background:white;
padding:14px
}

.date{
font-size:23px;
font-weight:bold;
margin:9px 0 16px;
color:#000;
white-space:nowrap
}

.date input{
font-size:23px;
font-weight:bold;
border:0;
outline:0;
color:#000;
background:white;
width:145px
}

.dateText{
margin-left:8px;
cursor:pointer
}

/* MAIN BILL BORDER */
.grid{
display:grid;
grid-template-columns:1fr 1fr;
border:3px solid #000;
}

table{
width:100%;
border-collapse:collapse;
table-layout:fixed
}

/* MIDDLE VERTICAL BORDER */
.grid table:first-child{
border-right:3px solid #000;
}

th,td{
border:2px solid #444;
height:44px;
padding:5px 9px;
width:33.333%;
color:#000;
font-size:18px
}

th{
text-align:left;
font-size:18px
}

/* HEADER BOTTOM BORDER */
thead th{
border-bottom:3px solid #000;
}

input{
width:100%;
border:0;
outline:0;
font-size:18px;
color:#000
}

/* TOTAL ROW */
.total td{
font-weight:bold;
background:#fafafa;
color:#000;
font-size:19px;
border-top:3px solid #000;
border-bottom:1px solid #ccc;
}

.summary{
font-size:26px;
font-weight:bold;
line-height:1.9;
margin-top:20px;
color:#000
}

.summary div{
display:grid;
grid-template-columns:180px 1fr;
white-space:nowrap
}

.summary b{
color:#000;
font-weight:bold
}

@media(max-width:700px){

.grid{
min-width:900px;
}

.bill{
overflow-x:auto;
}

th,td{
height:44px;
font-size:18px
}

input{
font-size:18px
}

.date{
font-size:22px
}

.summary{
font-size:23px
}

.summary div{
grid-template-columns:160px 1fr
}

}

@media print{

body{
background:white
}

.actions{
display:none
}

.grid{
grid-template-columns:1fr 1fr;
border:3px solid #000;
}

.grid table:first-child{
border-right:3px solid #000;
}

.bill{
padding:0
}

.date input{
border:0
}

}
</style>
</head>

<body>

<div class="app">

<div class="actions">
<button onclick="add()">+ Add Box</button>
<button onclick="removeLast()">− Remove</button>
<button onclick="newBill()">New Bill</button>
<button onclick="print()">Print / Save PDF</button>
<button onclick="savePhoto()">Save Photo</button>
</div>

<div class="bill">

<div class="date">
Date :- <span id="dateText" class="dateText"></span>

<input
type="date"
id="date"
style="position:absolute;opacity:0;width:1px;height:1px;">
</div>

<div class="grid">

<table>

<thead>
<tr>
<th>No.</th>
<th>Qty.</th>
<th>Weight.</th>
</tr>
</thead>

<tbody id="L"></tbody>

</table>

<table>

<thead>
<tr>
<th>No.</th>
<th>Qty.</th>
<th>Weight.</th>
</tr>
</thead>

<tbody id="R"></tbody>

</table>

</div>

<div class="summary">

<div>
<span>Total Avg :-</span>
<b id="avg">0.000</b>
</div>

<div>
<span>Total Qty :-</span>
<b id="qty">0</b>
</div>

<div>
<span>Total Weight :-</span>
<b id="weight">0.0</b>
</div>

</div>

</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

<script>

let n=30,
data=JSON.parse(localStorage.getItem('wb')||'{}');

n=data.n||30;
data=data.d||[];

let dateInput=document.getElementById('date');
let dateText=document.getElementById('dateText');

let savedDate=localStorage.getItem('wb_date');

if(savedDate){

dateInput.value=savedDate;

}else{

let d=new Date();

dateInput.value=
d.getFullYear()+'-'+
String(d.getMonth()+1).padStart(2,'0')+'-'+
String(d.getDate()).padStart(2,'0');

}

function showDate(){

let v=dateInput.value;

if(!v)return;

let p=v.split('-');

let year=p[0];
let month=p[1];
let day=p[2];

dateText.textContent=
day+' / '+month+' / '+year;

}

showDate();

dateText.onclick=function(){

dateInput.click();

};

dateInput.onchange=function(){

localStorage.setItem(
'wb_date',
this.value
);

showDate();

};

function draw(){

L.innerHTML='';
R.innerHTML='';

let h=Math.ceil(n/2);

for(let i=1;i<=n;i++){

let t=i<=h?L:R,
tr=document.createElement('tr');

tr.innerHTML=
'<td>'+i+'.</td>'+
'<td><input inputmode="numeric" data-i="'+i+'" data-k="q"></td>'+
'<td><input inputmode="decimal" data-i="'+i+'" data-k="w"></td>';

t.appendChild(tr);

let x=data[i-1]||{};

tr.querySelector('[data-k=q]').value=x.q||'';
tr.querySelector('[data-k=w]').value=x.w||'';

}

for(let t of [L,R]){

let tr=document.createElement('tr');

tr.className='total';

tr.innerHTML='<td>Total.</td><td>0</td><td>0.0</td>';

t.appendChild(tr);

}

document.querySelectorAll('input').forEach(x=>x.oninput=save);

calc();

}

function save(){

data=[];

document.querySelectorAll('input[data-i]')
.forEach(x=>{

let i=+x.dataset.i;

data[i-1]=data[i-1]||{};

data[i-1][x.dataset.k]=x.value;

});

localStorage.setItem(
'wb',
JSON.stringify({n:n,d:data})
);

calc();

}

function calc(){

let tq=0,
tw=0,
h=Math.ceil(n/2);

for(let i=0;i<n;i++){

tq+=+data[i]?.q||0;
tw+=+data[i]?.w||0;

}

document.getElementById('qty').textContent=tq;

document.getElementById('weight').textContent=
tw.toFixed(1);

document.getElementById('avg').textContent=
tq
?(Math.trunc(tw/tq*1000)/1000).toFixed(3)
:'0.000';

[[L,0,h],[R,h,n]].forEach(a=>{

let q=0,
w=0;

for(let i=a[1];i<a[2];i++){

q+=+data[i]?.q||0;
w+=+data[i]?.w||0;

}

let tr=a[0].querySelector('.total');

tr.children[1].textContent=q;
tr.children[2].textContent=w.toFixed(1);

});

}

function add(){

n+=2;
save();
draw();

}

function removeLast(){

if(n>1){

n--;
data=data.slice(0,n);
save();
draw();

}

}

function newBill(){

if(confirm('Current bill clear kare?')){

n=30;
data=[];

localStorage.removeItem('wb');

let d=new Date();

dateInput.value=
d.getFullYear()+'-'+
String(d.getMonth()+1).padStart(2,'0')+'-'+
String(d.getDate()).padStart(2,'0');

localStorage.setItem(
'wb_date',
dateInput.value
);

showDate();

draw();

}

}

async function savePhoto(){

let bill=document.querySelector('.bill');
let grid=document.querySelector('.grid');

let oldOverflow=bill.style.overflow;
let oldWidth=bill.style.width;
let oldPadding=bill.style.padding;

bill.style.overflow='visible';
bill.style.width=grid.scrollWidth+'px';
bill.style.padding='50px 30px 80px 30px';

let canvas=await html2canvas(bill,{
scale:3,
backgroundColor:'#ffffff',
width:bill.scrollWidth,
height:bill.scrollHeight,
windowWidth:bill.scrollWidth
});

bill.style.overflow=oldOverflow;
bill.style.width=oldWidth;
bill.style.padding=oldPadding;

let link=document.createElement('a');

link.download='Weight-Bill.jpg';

link.href=canvas.toDataURL('image/jpeg',0.95);

link.click();

}

draw();

</script>

</body>
</html>
