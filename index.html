<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Weight Bill App</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    padding:12px;
    font-family:Arial,sans-serif;
    background:#f5f5f5;
    color:#222;
}

.container{
    max-width:1100px;
    margin:auto;
}

h1{
    text-align:center;
    margin:5px 0 12px;
    font-size:26px;
}

.date-row{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:12px;
}

.date-row label{
    font-weight:bold;
    font-size:18px;
    color:#222;
}

.date-row input{
    max-width:190px;
    font-size:17px;
    color:#222;
}

.bill-date{
    text-align:right;
    font-weight:bold;
    font-size:18px;
    color:#222;
    margin:5px 2px 8px;
}

.bill-area{
    background:#fff;
    border:1px solid #aaa;
}

.tables{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:0;
}

.table-box{
    min-width:0;
}

.table-box:first-child{
    border-right:1px solid #aaa;
}

table{
    width:100%;
    border-collapse:collapse;
    table-layout:fixed;
}

th{
    border:1px solid #aaa;
    padding:8px 5px;
    font-size:16px;
    font-weight:bold;
    color:#222;
    background:#fff;
}

td{
    border:1px solid #aaa;
    padding:0;
    height:36px;
    background:#fff;
}

td:first-child{
    width:22%;
    text-align:center;
    font-weight:bold;
    color:#222;
    font-size:16px;
}

td:nth-child(2){
    width:39%;
}

td:nth-child(3){
    width:39%;
}

input{
    width:100%;
    padding:7px;
    border:0;
    border-radius:0;
    font-size:16px;
    text-align:left;
    background:#fff;
    color:#222;
    outline:none;
}

input:focus{
    background:#f8f8f8;
}

.side-total{
    display:grid;
    grid-template-columns:1fr 1fr 1fr;
    width:100%;
    margin-top:0;
    gap:0;
    white-space:nowrap;
}

.side-total .total-box{
    box-sizing:border-box;
    border:1px solid #aaa;
    border-right:0;
    border-top:0;
    padding:7px 10px;
    min-width:0;
    height:42px;
    display:flex;
    align-items:center;
    justify-content:flex-start;
    background:#fff;
}

.side-total .total-box:last-child{
    border-right:1px solid #aaa;
}

.side-total .total-box:first-child .label{
    font-size:15px;
    font-weight:bold;
    color:#222;
    margin:0;
}

.side-total .total-box .value{
    font-size:19px;
    font-weight:bold;
    color:#222;
    margin:0;
}

.combined{
    margin-top:14px;
    background:#fff;
    border:1px solid #aaa;
    padding:10px 12px;
}

.combined h3{
    text-align:left;
    margin:0 0 8px;
    font-size:20px;
    font-weight:bold;
    color:#222;
}

.totals{
    width:100%;
}

.totals .total-box{
    border:0;
    padding:5px 0;
    text-align:left;
    display:flex;
    justify-content:flex-start;
    align-items:center;
    gap:12px;
}

.totals .total-box .label{
    font-size:20px;
    font-weight:bold;
    color:#222;
    min-width:170px;
}

.totals .total-box .value{
    font-size:24px;
    font-weight:bold;
    color:#222;
    margin:0;
}

.buttons{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-top:14px;
}

button{
    border:0;
    padding:10px 14px;
    border-radius:6px;
    background:#222;
    color:#fff;
    font-size:15px;
    font-weight:bold;
    cursor:pointer;
}

button:active{
    transform:scale(.98);
}

@media(max-width:700px){

    body{
        padding:7px;
    }

    h1{
        font-size:23px;
    }

    .tables{
        grid-template-columns:1fr 1fr;
    }

    th{
        font-size:14px;
        padding:7px 3px;
    }

    td:first-child{
        font-size:14px;
    }

    input{
        font-size:15px;
        padding:7px 4px;
    }

    .side-total{
        grid-template-columns:repeat(3,minmax(0,1fr));
    }

    .side-total .total-box{
        padding:7px 5px;
    }

    .side-total .total-box:first-child .label{
        font-size:13px;
    }

    .side-total .total-box .value{
        font-size:17px;
    }

    .combined h3{
        font-size:20px;
    }

    .totals .total-box .label{
        font-size:19px;
        min-width:145px;
    }

    .totals .total-box .value{
        font-size:23px;
    }

    .buttons button{
        flex:1 1 calc(50% - 8px);
    }
}

@media print{

    body{
        background:#fff;
        padding:0;
    }

    .buttons,
    .date-row{
        display:none !important;
    }

    .container{
        max-width:none;
    }

    .bill-area{
        border:1px solid #000;
    }

    th,
    td,
    .side-total .total-box{
        border-color:#000;
    }

    .combined{
        border-color:#000;
    }
}
</style>
</head>

<body>

<div class="container">

    <h1>WEIGHT BILL</h1>

    <div class="date-row">
        <label for="billDate">Date:</label>
        <input type="date" id="billDate">
    </div>

    <div class="bill-area" id="billArea">

        <div class="bill-date">
            <span id="showDate"></span>
        </div>

        <div class="tables">

            <!-- LEFT TABLE -->
            <div class="table-box">

                <table>
                    <thead>
                        <tr>
                            <th>No.</th>
                            <th>Qty.</th>
                            <th>Weight.</th>
                        </tr>
                    </thead>

                    <tbody id="leftRows"></tbody>
                </table>

                <div class="side-total">

                    <div class="total-box">
                        <div class="label">Total.</div>
                    </div>

                    <div class="total-box">
                        <div class="value" id="leftQty">0</div>
                    </div>

                    <div class="total-box">
                        <div class="value" id="leftWeight">0.0</div>
                    </div>

                </div>

            </div>


            <!-- RIGHT TABLE -->
            <div class="table-box">

                <table>
                    <thead>
                        <tr>
                            <th>No.</th>
                            <th>Qty.</th>
                            <th>Weight.</th>
                        </tr>
                    </thead>

                    <tbody id="rightRows"></tbody>
                </table>

                <div class="side-total">

                    <div class="total-box">
                        <div class="label">Total.</div>
                    </div>

                    <div class="total-box">
                        <div class="value" id="rightQty">0</div>
                    </div>

                    <div class="total-box">
                        <div class="value" id="rightWeight">0.0</div>
                    </div>

                </div>

            </div>

        </div>


        <!-- COMBINED TOTAL -->
        <div class="combined">

            <h3>Combined Total</h3>

            <div class="totals">

                <div class="total-box">
                    <div class="label">Total AVG :-</div>
                    <div class="value" id="totalAvg">0.000</div>
                </div>

                <div class="total-box">
                    <div class="label">Total Qty :-</div>
                    <div class="value" id="totalQty">0</div>
                </div>

                <div class="total-box">
                    <div class="label">Total Weight :-</div>
                    <div class="value" id="totalWeight">0.0</div>
                </div>

            </div>

        </div>

    </div>


    <!-- BUTTONS -->
    <div class="buttons">

        <button onclick="addBox()">+ Add Box</button>

        <button onclick="removeBox()">− Remove Box</button>

        <button onclick="newBill()">New Bill</button>

        <button onclick="printBill()">Print</button>

        <button onclick="saveJPG()">Save JPG</button>

        <button onclick="shareBill()">Share</button>

        <button onclick="copyBill()">Copy</button>

    </div>

</div>


<script>

let boxCount = 30;

const today = new Date();

document.getElementById('billDate').value =
    today.toISOString().slice(0,10);


// CREATE ROW
function createRow(i, data){

    const tr = document.createElement('tr');

    tr.innerHTML = `
        <td>${i}.</td>

        <td>
            <input
                type="number"
                min="0"
                step="1"
                inputmode="numeric"
                class="qty"
                value="${data?.q || ''}"
                oninput="calculate()"
            >
        </td>

        <td>
            <input
                type="number"
                min="0"
                step="0.1"
                inputmode="decimal"
                class="weight"
                value="${data?.w || ''}"
                oninput="calculate()"
            >
        </td>
    `;

    return tr;
}


// COLLECT DATA
function collectData(){

    const data = {};

    document.querySelectorAll('#billArea tbody tr').forEach(tr => {

        const n =
            parseInt(tr.children[0].textContent) || 0;

        data[n] = {

            q: tr.querySelector('.qty').value,

            w: tr.querySelector('.weight').value

        };

    });

    return data;
}


// RENDER ROWS
function renderRows(saved){

    const data = saved || collectData();

    const left =
        document.getElementById('leftRows');

    const right =
        document.getElementById('rightRows');

    left.innerHTML = '';

    right.innerHTML = '';

    const leftCount =
        Math.ceil(boxCount / 2);


    for(let i = 1; i <= boxCount; i++){

        if(i <= leftCount){

            left.appendChild(
                createRow(i, data[i])
            );

        }else{

            right.appendChild(
                createRow(i, data[i])
            );

        }

    }

    calculate();
}


// CALCULATE TOTALS
function calculate(){

    let tq = 0;
    let tw = 0;

    let lq = 0;
    let lw = 0;

    let rq = 0;
    let rw = 0;


    document.querySelectorAll('#billArea tbody tr')
    .forEach(tr => {

        const q =
            parseFloat(
                tr.querySelector('.qty').value
            ) || 0;

        const w =
            parseFloat(
                tr.querySelector('.weight').value
            ) || 0;

        const n =
            parseInt(
                tr.children[0].textContent
            ) || 0;


        tq += q;
        tw += w;


        const leftCount =
            Math.ceil(boxCount / 2);


        if(n <= leftCount){

            lq += q;
            lw += w;

        }else{

            rq += q;
            rw += w;

        }

    });


    document.getElementById('leftQty')
        .textContent = lq;

    document.getElementById('leftWeight')
        .textContent = lw.toFixed(1);


    document.getElementById('rightQty')
        .textContent = rq;

    document.getElementById('rightWeight')
        .textContent = rw.toFixed(1);


    document.getElementById('totalQty')
        .textContent = tq;

    document.getElementById('totalWeight')
        .textContent = tw.toFixed(1);


    document.getElementById('totalAvg')
        .textContent =
        tq ? (tw / tq).toFixed(3) : '0.000';


    showDate();
}


// SHOW DATE
function showDate(){

    const v =
        document.getElementById('billDate').value;


    if(!v){

        document.getElementById('showDate')
            .textContent = '';

        return;
    }


    const [y,m,d] = v.split('-');


    document.getElementById('showDate')
        .textContent = `${d} / ${m} / ${y}`;
}


document.getElementById('billDate')
    .addEventListener('change', calculate);


// ADD BOX
function addBox(){

    const saved = collectData();

    boxCount += 2;

    renderRows(saved);
}


// REMOVE BOX
function removeBox(){

    if(boxCount <= 2){

        alert(
            'कम से कम 2 Box रखना जरूरी है.'
        );

        return;
    }


    const saved = collectData();


    delete saved[boxCount];

    delete saved[boxCount - 1];


    boxCount -= 2;


    renderRows(saved);
}


// NEW BILL
function newBill(){

    if(
        !confirm(
            'New Bill બનાવવાથી બધા Qty અને Weight ખાલી થઈ જશે. Continue?'
        )
    ){

        return;
    }


    boxCount = 30;


    document.getElementById('billDate').value =
        new Date().toISOString().slice(0,10);


    renderRows({});


    window.scrollTo({
        top:0,
        behavior:'smooth'
    });
}


// PRINT
function printBill(){

    calculate();

    window.print();
}


// BILL TEXT
function billText(){

    calculate();


    let lines = [

        'WEIGHT BILL',

        'Date: ' +
        document.getElementById('showDate').textContent,

        '--------------------'

    ];


    document.querySelectorAll(
        '#billArea tbody tr'
    ).forEach(tr => {

        let q =
            tr.querySelector('.qty').value || '0';

        let w =
            tr.querySelector('.weight').value || '0';


        if(q !== '0' || w !== '0'){

            lines.push(
                `Box ${tr.children[0].textContent}: Qty ${q} | Weight ${w}`
            );

        }

    });


    lines.push(

        '--------------------',

        `Total AVG: ${document.getElementById('totalAvg').textContent}`,

        `Total Qty: ${document.getElementById('totalQty').textContent}`,

        `Total Weight: ${document.getElementById('totalWeight').textContent}`

    );


    return lines.join('\n');
}


// COPY BILL
async function copyBill(){

    const text = billText();


    try{

        await navigator.clipboard.writeText(text);

        alert('Bill text copy થઈ ગયું ✅');

    }catch(e){

        prompt(
            'આ text copy કરો:',
            text
        );

    }

}


// LOAD HTML2CANVAS
function loadHtml2Canvas(){

    return new Promise((resolve,reject)=>{

        if(window.html2canvas){

            return resolve();

        }


        const s =
            document.createElement('script');


        s.src =
            'https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js';


        s.onload = resolve;

        s.onerror = reject;


        document.head.appendChild(s);

    });

}


// MAKE JPG
async function makeJpg(){

    calculate();

    await loadHtml2Canvas();


    return await html2canvas(

        document.getElementById('billArea'),

        {
            scale:4,
            useCORS:true,
            backgroundColor:'#fff',
            logging:false
        }

    );

}


// SAVE JPG
async function saveJPG(){

    try{

        const canvas =
            await makeJpg();


        const a =
            document.createElement('a');


        a.download =
            'Weight_Bill_' +
            new Date().toISOString().slice(0,10) +
            '.jpg';


        a.href =
            canvas.toDataURL(
                'image/jpeg',
                0.98
            );


        a.click();

    }catch(e){

        alert(
            'Save Image માટે Internet ON કરીને ફરી try કરો.'
        );

    }

}


// SHARE BILL
async function shareBill(){

    try{

        const canvas =
            await makeJpg();


        const blob =
            await new Promise(
                r => canvas.toBlob(
                    r,
                    'image/jpeg',
                    0.98
                )
            );


        const file =
            new File(
                [blob],
                'Weight_Bill.jpg',
                {
                    type:'image/jpeg'
                }
            );


        if(
            navigator.share &&
            (
                !navigator.canShare ||
                navigator.canShare({
                    files:[file]
                })
            )
        ){

            await navigator.share({

                title:'Weight Bill',

                text:billText(),

                files:[file]

            });

        }

        else if(navigator.share){

            await navigator.share({

                title:'Weight Bill',

                text:billText()

            });

        }

        else{

            window.open(
                'https://wa.me/?text=' +
                encodeURIComponent(
                    billText()
                ),
                '_blank'
            );

        }

    }catch(e){

        if(e.name !== 'AbortError'){

            window.open(
                'https://wa.me/?text=' +
                encodeURIComponent(
                    billText()
                ),
                '_blank'
            );

        }

    }

}


// START
renderRows({});

</script>

</body>
</html>
