<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Weight Bill App</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    background:#f3f3f3;
    font-family:Arial,sans-serif;
    color:#222;
}

.app{
    max-width:1100px;
    margin:auto;
    padding:8px;
}

.top,.card{
    background:#fff;
    border:1px solid #ccc;
}

.top{
    padding:10px;
}

.top h1{
    margin:0;
    font-size:22px;
}

.top p{
    margin:4px 0 0;
    color:#666;
    font-size:13px;
}

.card{
    padding:10px;
    border-top:0;
}

.actions{
    display:flex;
    gap:6px;
    flex-wrap:wrap;
    margin-bottom:10px;
}

button{
    padding:9px 12px;
    background:#fff;
    border:1px solid #888;
    font-weight:bold;
}

.date{
    margin-bottom:10px;
    font-weight:bold;
}

/* EDIT CONTROL */
.edit-tools{
    display:none;
    border:1px solid #aaa;
    background:#fafafa;
    padding:10px;
    margin-bottom:10px;
}

.edit-tools button{
    margin:2px;
}

.edit-tools label{
    font-weight:bold;
    margin-right:5px;
}

/* BILL */
.bill{
    background:#fff;
    padding:10px;

    --fs:16px;
    --row:38px;
    --ink:25;
}

.bill-date{
    font-size:var(--fs);
    font-weight:bold;
    margin-bottom:10px;
}

.sides{
    display:grid;
    grid-template-columns:1fr 1fr;
}

table{
    width:100%;
    border-collapse:collapse;
    table-layout:fixed;
}

th,td{
    border:1px solid #888;
    height:var(--row);
    padding:4px 7px;
    font-size:var(--fs);
    color:rgb(var(--ink),var(--ink),var(--ink));
}

th{
    font-weight:bold;
}

th:first-child,
td:first-child{
    width:20%;
}

th:nth-child(2),
td:nth-child(2){
    width:38%;
}

th:nth-child(3),
td:nth-child(3){
    width:42%;
}

/* DIRECT EDIT CELLS */
.cell{
    width:100%;
    height:100%;
    border:0;
    outline:0;
    background:transparent;
    padding:0;
    font-size:inherit;
    color:inherit;
}

.cell:focus{
    background:#fffde8;
}

/* TOTAL */
.total-row{
    font-weight:bold;
}

.big-total{
    margin-top:15px;
    font-size:calc(var(--fs) + 4px);
    font-weight:bold;
}

.big-total input{
    width:150px;
    border:0;
    outline:0;
    background:transparent;
    font-size:inherit;
    font-weight:bold;
    color:inherit;
}

.big-total input:focus{
    background:#fffde8;
}

/* MOBILE */
@media(max-width:700px){

    .app{
        padding:5px;
    }

    .top h1{
        font-size:19px;
    }

    .bill{
        padding:4px;
    }

    th,td{
        font-size:calc(var(--fs) - 3px);
        height:var(--row);
        padding:3px;
    }

    .cell{
        font-size:calc(var(--fs) - 3px);
    }

    .big-total{
        font-size:calc(var(--fs) + 1px);
    }
}

/* PRINT */
@media print{

    body{
        background:#fff;
    }

    .actions,
    .date,
    .edit-tools,
    .top{
        display:none !important;
    }

    .card{
        border:0;
        padding:0;
    }

    .bill{
        padding:0;
    }

    th,td{
        font-size:12px;
        height:32px;
    }

    .big-total{
        font-size:17px;
    }
}
</style>
</head>

<body>

<div class="app">

<div class="top">
<h1>Weight Bill App</h1>
<p>Google Sheets જેવી Direct Editing</p>
</div>

<div class="card">

<div class="date">
Date:
<input id="billDate" type="date">
</div>

<div class="actions">

<button onclick="addBox()">+ Add 2 Box</button>

<button onclick="removeBox()">− Remove 2 Box</button>

<button onclick="newBill()">New Bill</button>

<button onclick="window.print()">🖨️ Print / PDF</button>

<button onclick="savePhoto()">🖼️ Save Photo</button>

<button onclick="copyBill()">📋 Copy</button>

<button onclick="toggleEdit()">✏️ Size / Colour</button>

</div>


<!-- SIZE / COLOUR -->
<div class="edit-tools" id="editTools">

<label>Box Size</label>

<button onclick="changeRow(-2)">−</button>

<span id="rowSize">38</span>

<button onclick="changeRow(2)">+</button>

&nbsp;&nbsp;

<label>Text Size</label>

<button onclick="changeFont(-1)">A−</button>

<span id="fontSize">16</span>

<button onclick="changeFont(1)">A+</button>

&nbsp;&nbsp;

<label>Colour</label>

<input
id="colorRange"
type="range"
min="40"
max="150"
value="25"
oninput="changeColor(this.value)"
>

</div>


<!-- BILL -->
<div class="bill" id="bill">

<div class="bill-date">
Date:- <span id="showDate"></span>
</div>


<div class="sides">

<!-- LEFT -->

<div>

<table>

<thead>

<tr>
<th>No.</th>
<th>Qty.</th>
<th>Weight.</th>
</tr>

</thead>

<tbody id="leftRows"></tbody>

<tfoot>

<tr class="total-row">

<td>Total.</td>

<td>
<input
class="cell"
id="leftQty"
value="0"
>
</td>

<td>
<input
class="cell"
id="leftWeight"
value="0.0"
>
</td>

</tr>

</tfoot>

</table>

</div>


<!-- RIGHT -->

<div>

<table>

<thead>

<tr>
<th>No.</th>
<th>Qty.</th>
<th>Weight.</th>
</tr>

</thead>

<tbody id="rightRows"></tbody>

<tfoot>

<tr class="total-row">

<td>Total.</td>

<td>
<input
class="cell"
id="rightQty"
value="0"
>
</td>

<td>
<input
class="cell"
id="rightWeight"
value="0.0"
>
</td>

</tr>

</tfoot>

</table>

</div>

</div>


<!-- TOTALS -->

<div class="big-total">

Total AVG :-

<input
id="totalAvg"
value="0.000"
>

</div>


<div class="big-total">

Total Qty :-

<input
id="totalQty"
value="0"
>

</div>


<div class="big-total">

Total Weight :-

<input
id="totalWeight"
value="0.0"
>

</div>

</div>

</div>
</div>


<script>

let boxCount = 30;

let rowHeight = 38;

let fontSizeValue = 16;

let textColor = 25;


/* DATE */

const today = new Date();

billDate.value =
today.toISOString().slice(0,10);


function showDate(){

    const value =
    billDate.value;

    if(!value){

        showDate.textContent = "";

        return;
    }

    const [y,m,d] =
    value.split("-");

    document.getElementById(
        "showDate"
    ).textContent =
    `${d} / ${m} / ${y}`;
}

billDate.addEventListener(
    "change",
    showDate
);


/* CREATE ROW */

function createRow(number,data={}){

    const tr =
    document.createElement("tr");

    tr.innerHTML = `

    <td>${number}.</td>

    <td>

        <input
        class="cell qty"
        type="number"
        min="0"
        step="1"
        value="${data.qty || ""}"
        >

    </td>

    <td>

        <input
        class="cell weight"
        type="number"
        min="0"
        step="0.1"
        value="${data.weight || ""}"
        >

    </td>

    `;


    tr.querySelectorAll(
        "input"
    ).forEach(input=>{

        input.addEventListener(
            "input",
            calculate
        );

    });


    return tr;
}


/* SAVE VALUES */

function getValues(){

    const data = {};

    document
    .querySelectorAll(
        "#bill tbody tr"
    )
    .forEach(tr=>{

        const number =
        parseInt(
            tr.children[0]
            .textContent
        );

        data[number] = {

            qty:
            tr.querySelector(
                ".qty"
            ).value,

            weight:
            tr.querySelector(
                ".weight"
            ).value

        };

    });

    return data;
}


/* RENDER */

function renderRows(data={}){

    leftRows.innerHTML = "";

    rightRows.innerHTML = "";


    const leftCount =
    Math.ceil(
        boxCount / 2
    );


    for(
        let i=1;
        i<=boxCount;
        i++
    ){

        const tr =
        createRow(
            i,
            data[i] || {}
        );


        if(
            i <= leftCount
        ){

            leftRows.appendChild(tr);

        }else{

            rightRows.appendChild(tr);

        }

    }


    calculate();

    showDate();
}


/* CALCULATE */

function calculate(){

    let lq = 0;

    let lw = 0;

    let rq = 0;

    let rw = 0;


    document
    .querySelectorAll(
        "#bill tbody tr"
    )
    .forEach(tr=>{

        const q =
        parseFloat(
            tr.querySelector(
                ".qty"
            ).value
        ) || 0;


        const w =
        parseFloat(
            tr.querySelector(
                ".weight"
            ).value
        ) || 0;


        const number =
        parseInt(
            tr.children[0]
            .textContent
        );


        if(
            number <=
            Math.ceil(
                boxCount / 2
            )
        ){

            lq += q;

            lw += w;

        }else{

            rq += q;

            rw += w;

        }

    });


    /*
       Auto calculation:
       જો તમે total manually edit
       કરવું હોય તો calculate પછી
       edit કરી શકો છો.
    */

    leftQty.value = lq;

    leftWeight.value =
    lw.toFixed(1);

    rightQty.value = rq;

    rightWeight.value =
    rw.toFixed(1);


    const totalQtyValue =
    lq + rq;

    const totalWeightValue =
    lw + rw;


    totalQty.value =
    totalQtyValue;

    totalWeight.value =
    totalWeightValue.toFixed(1);


    totalAvg.value =
    totalQtyValue > 0
    ? (
        totalWeightValue /
        totalQtyValue
      ).toFixed(3)
    : "0.000";


    showDate();
}


/* ADD 2 */

function addBox(){

    const data =
    getValues();

    boxCount += 2;

    renderRows(data);
}


/* REMOVE 2 */

function removeBox(){

    if(boxCount <= 2){

        alert(
            "Minimum 2 Box રાખવા જરૂરી છે."
        );

        return;
    }


    const data =
    getValues();

    boxCount -= 2;

    renderRows(data);
}


/* NEW BILL */

function newBill(){

    if(
        !confirm(
            "બધા Qty અને Weight ખાલી થશે. Continue?"
        )
    ){

        return;
    }


    boxCount = 30;


    billDate.value =
    new Date()
    .toISOString()
    .slice(0,10);


    renderRows({});


    window.scrollTo({

        top:0,

        behavior:"smooth"

    });
}


/* EDIT PANEL */

function toggleEdit(){

    const tools =
    document.getElementById(
        "editTools"
    );


    tools.style.display =
    tools.style.display === "block"
    ? "none"
    : "block";
}


/* ROW SIZE */

function changeRow(amount){

    rowHeight += amount;


    if(rowHeight < 28)
        rowHeight = 28;


    if(rowHeight > 70)
        rowHeight = 70;


    document.documentElement
    .style
    .setProperty(
        "--row",
        rowHeight + "px"
    );


    document.getElementById(
        "rowSize"
    ).textContent =
    rowHeight;
}


/* FONT SIZE */

function changeFont(amount){

    fontSizeValue += amount;


    if(fontSizeValue < 11)
        fontSizeValue = 11;


    if(fontSizeValue > 28)
        fontSizeValue = 28;


    document.documentElement
    .style
    .setProperty(
        "--fs",
        fontSizeValue + "px"
    );


    document.getElementById(
        "fontSize"
    ).textContent =
    fontSizeValue;
}


/* COLOR */

function changeColor(value){

    textColor =
    parseInt(value);


    document.documentElement
    .style
    .setProperty(
        "--ink",
        textColor
    );
}


/* COPY */

async function copyBill(){

    calculate();


    let text =
    "WEIGHT BILL\n";


    text +=
    "Date:- " +
    showDate.textContent +
    "\n";


    document
    .querySelectorAll(
        "#bill tbody tr"
    )
    .forEach(tr=>{

        const q =
        tr.querySelector(
            ".qty"
        ).value;


        const w =
        tr.querySelector(
            ".weight"
        ).value;


        if(q || w){

            text +=
            `No. ${tr.children[0].textContent} Qty: ${q} Weight: ${w}\n`;

        }

    });


    text +=
    "\nTotal AVG :- " +
    totalAvg.value;


    text +=
    "\nTotal Qty :- " +
    totalQty.value;


    text +=
    "\nTotal Weight :- " +
    totalWeight.value;


    try{

        await navigator
        .clipboard
        .writeText(text);


        alert(
            "Copy થઈ ગયું ✅"
        );

    }catch(e){

        prompt(
            "Text copy કરો:",
            text
        );

    }

}


/* SAVE PHOTO */

async function savePhoto(){

    try{

        if(!window.html2canvas){

            const script =
            document.createElement(
                "script"
            );


            script.src =
            "https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js";


            await new Promise(
                (resolve,reject)=>{

                    script.onload =
                    resolve;

                    script.onerror =
                    reject;

                    document.head.appendChild(
                        script
                    );

                }
            );

        }


        const canvas =
        await html2canvas(
            document.getElementById(
                "bill"
            ),
            {

                scale:4,

                backgroundColor:
                "#ffffff",

                useCORS:true

            }
        );


        const link =
        document.createElement(
            "a"
        );


        link.download =
        "Weight_Bill_Full_HD.png";


        link.href =
        canvas.toDataURL(
            "image/png"
        );


        link.click();


    }catch(e){

        alert(
            "Photo save કરવા Internet ON કરીને ફરી try કરો."
        );

    }

}


/* START */

document.documentElement
.style
.setProperty(
    "--row",
    rowHeight + "px"
);


document.documentElement
.style
.setProperty(
    "--fs",
    fontSizeValue + "px"
);


document.documentElement
.style
.setProperty(
    "--ink",
    textColor
);


renderRows({});

</script>

</body>
</html>
